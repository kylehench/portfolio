services:
  flask-app:
    build: .
    container_name: portfolio
    networks:
      - traefik_net_private
    restart: always
    labels:
      - "traefik.enable=true"
      # - "traefik.http.routers.flask.rule=Host(`localhost`)"
      # - "traefik.http.routers.flask.rule=Host(`crostiniprivatetunnel.kylehench.com`) && PathPrefix(`/portfolio`)"
      # - "traefik.http.routers.flask.rule=Host(`kylehench.com`)"
      - "traefik.http.routers.flask.rule=(Host(`kylehench.com`) || Host(`www.kylehench.com`))"
      - "traefik.http.routers.flask.entrypoints=web"
      - "traefik.http.services.flask.loadbalancer.server.port=5000"

      # strip prefixes
      # - "traefik.http.middlewares.portfolio-strip.stripprefix.prefixes=/portfolio"
      # - "traefik.http.routers.flask.middlewares=portfolio-strip"

networks:
  traefik_net_private:
    external: true
